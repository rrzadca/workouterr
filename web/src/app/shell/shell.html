<header
  class="flex min-h-control-xl shrink-0 items-center gap-3 border-b border-border-hairline bg-surface-chrome px-3 py-1 backdrop-blur-vibrancy backdrop-saturate-180"
>
  <!-- An empty box as wide as the toggle, so the title stays centred -->
  <span class="w-control-xl shrink-0"></span>
  <div class="min-w-0 flex-1 text-center leading-tight">
    <span class="block text-title-3 font-semibold text-text-strong">{{ 'app.name' | transloco }}</span>
    <span class="block text-caption text-text-muted">{{ today | formatDate: 'long' }}</span>
  </div>
  <button
    rad-button
    variant="ghost"
    iconOnly
    [attr.aria-label]="appearance().themeToggleLabelKey | transloco"
    [attr.title]="appearance().themeToggleLabelKey | transloco"
    (click)="themeService.toggle()"
  >
    <svg [lucideIcon]="appearance().themeToggleIcon" [size]="20" />
  </button>
</header>

<div class="flex min-h-0 flex-1">
  <nav
    rad-sidebar-nav
    class="w-sidebar shrink-0"
    [sections]="sections()"
    [attr.aria-label]="'shell.mainNavigation' | transloco"
  >
    <div sidebarHeader class="flex items-center gap-2 px-2 pt-1 pb-1.5">
      <img [src]="'assets/images/logo-simple-' + appearance().logoVariant + '.png'" alt="" class="h-[26px] w-auto" />
      <img
        [src]="'assets/images/logo-name-' + appearance().logoVariant + '.png'"
        [alt]="'app.name' | transloco"
        class="h-[13px] w-auto"
      />
    </div>
  </nav>

  <main class="min-w-0 flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
