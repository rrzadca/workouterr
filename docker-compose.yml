# Local development only; production runs on MyDevil without Docker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workouterr
      POSTGRES_USER: workouterr
      POSTGRES_PASSWORD: workouterr
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workouterr -d workouterr']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
