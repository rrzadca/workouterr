# Services for local development only: `docker compose -f deploy/compose.dev.yaml up -d`.
name: workouterr-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: workouterr
      POSTGRES_USER: workouterr
      POSTGRES_PASSWORD: workouterr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username workouterr --dbname workouterr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
