<div class="flex h-dvh" *transloco="let t">
  <nav
    class="flex w-sidebar shrink-0 flex-col gap-4 overflow-y-auto border-r border-border-hairline bg-surface-sidebar px-2 pt-3"
    [attr.aria-label]="t('nav.label')"
  >
    <a routerLink="/" class="flex items-center gap-2 px-2.5 pb-1.5">
      <img [src]="'brand/logo-mark-' + themeChoice().logoColour + '.png'" alt="" class="h-7.5" />
      <img [src]="'brand/logo-word-' + themeChoice().logoColour + '.png'" [alt]="t('app.name')" class="h-3.75" />
    </a>

    <div class="flex flex-col gap-px">
      <span class="px-2.5 py-1 text-caption font-semibold tracking-caps text-text-faint uppercase">
        {{ t('nav.training') }}
      </span>
      <a
        routerLink="/"
        routerLinkActive
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        [class]="navLinkClasses"
      >
        <rad-icon name="house" [size]="20" />
        <span class="min-w-0 flex-1 truncate">{{ t('nav.home') }}</span>
      </a>
    </div>

    <div class="mt-auto flex items-center gap-2 border-t border-border-hairline py-2 pl-1.5">
      <span
        class="flex size-8 shrink-0 items-center justify-center rounded-pill bg-accent text-label font-semibold text-text-on-accent"
        aria-hidden="true"
      >
        {{ initial() }}
      </span>
      <span class="min-w-0 flex-1">
        <span class="block truncate text-label font-semibold text-text-strong">{{ user()?.email }}</span>
        <span class="block truncate text-caption text-text-muted">{{ t('nav.noActivePlan') }}</span>
      </span>
      <rad-icon-button
        [icon]="themeChoice().toggleIcon"
        [label]="t(themeChoice().toggleLabelKey)"
        (click)="toggleTheme()"
      />
      <rad-icon-button icon="log-out" [label]="t('nav.logout')" [loading]="loggingOut()" (click)="logout()" />
    </div>
  </nav>

  <main class="min-w-0 flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
